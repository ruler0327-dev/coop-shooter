<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Co-op Shooter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="lobby">
      <div class="lobby-card">
        <h1>Co-op Shooter</h1>
        <p class="subtitle">2～4 人合作打怪 · 波次生存 · Boss 戰 · Roguelike 強化</p>

        <div id="invite-banner" class="invite-banner" hidden></div>

        <label class="field">
          <span>玩家暱稱（1～12 字元）</span>
          <div class="row">
            <input id="nickname-input" type="text" maxlength="12" placeholder="輸入暱稱" autocomplete="off" />
            <button id="random-name-btn" type="button">隨機</button>
          </div>
        </label>

        <button id="create-btn" class="primary" type="button" disabled>建立新房間</button>

        <div class="divider"><span>或加入現有房間</span></div>

        <label class="field">
          <span>房號</span>
          <div class="row">
            <input id="room-input" type="text" maxlength="4" placeholder="輸入 4 碼房號" autocomplete="off" />
            <button id="join-btn" type="button" disabled>加入房間</button>
          </div>
        </label>

        <p id="lobby-error" class="error"></p>
        <p id="lobby-status" class="status">連線伺服器中…</p>

        <div class="legend">
          <span><i style="background:#3fb950"></i>醫療包 +30</span>
          <span><i style="background:#58a6ff"></i>散彈強化</span>
          <span><i style="background:#ffd43b"></i>疾風加速</span>
          <span><i style="background:#a855f7"></i>衝刺怪</span>
          <span><i style="background:#38bdf8"></i>射手怪</span>
        </div>
      </div>
    </div>

    <div id="room-panel" hidden>
      <div class="room-head">
        <span>房號：<strong id="room-code">----</strong></span>
        <span id="room-count">(0/4)</span>
        <button id="copy-link-btn" type="button">複製邀請連結</button>
        <button id="leave-btn" type="button">離開</button>
      </div>
      <div id="scoreboard"></div>
    </div>

    <div id="top-right" hidden>
      <span id="ping">連線中…</span>
      <button id="mute-btn" type="button" title="靜音 / 取消靜音 (M)">🔊</button>
    </div>

    <div id="waiting-panel" hidden>
      <div id="waiting-title">等待房主開始遊戲…</div>
      <div id="waiting-sub">房間準備好後即可開戰</div>
      <button id="start-btn" type="button" hidden>開始遊戲</button>
    </div>

    <div id="upgrade-overlay" hidden>
      <div class="upg-box">
        <div class="upg-head">
          <div id="upgrade-title">第 1 波完成！選擇一項永久強化</div>
          <div id="upgrade-timer">15</div>
        </div>
        <div id="upgrade-cards"></div>
        <div id="upgrade-status">按 1 / 2 / 3 或點擊卡片選擇</div>
      </div>
    </div>
  </div>

  <div id="hud">WASD / 方向鍵移動 · 滑鼠瞄準 · 按住左鍵射擊 · 靠近倒地隊友 2 秒救援 · 每波選擇永久強化 · M 靜音</div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
