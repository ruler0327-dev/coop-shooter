<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Co-op Shooter</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1600" height="900"></canvas>

    <!-- 房間內：左上角房號、邀請連結與記分板 -->
    <div id="room-panel" hidden>
      <div class="room-head">
        <span id="room-code">房號 ----</span>
        <span id="room-count">人數 1/4</span>
        <button id="copy-btn" type="button">複製邀請連結</button>
        <button id="leave-btn" type="button">離開</button>
      </div>
      <div id="scoreboard"></div>
    </div>

    <!-- 房間內：右上角怪物數量與靜音按鈕 -->
    <div id="top-right" hidden>
      <span id="monster-count">怪物 0/30</span>
      <button id="mute-btn" type="button" aria-pressed="false" title="音效開啟中（M）">🔊</button>
    </div>

    <!-- 房間內：等待房主開始遊戲的面板 -->
    <div id="waiting-panel" hidden>
      <div id="waiting-title">等待房主開始遊戲…</div>
      <div id="waiting-sub">先熟悉一下操作，可以自由移動與試射</div>
      <button id="start-btn" type="button" hidden>開始遊戲</button>
    </div>

    <!-- 每波結束：三選一永久強化覆蓋層 -->
    <div id="upgrade-overlay" hidden>
      <div class="upg-box">
        <div class="upg-head">
          <div id="upgrade-title">WAVE 1 完成！選擇一項永久強化</div>
          <div id="upgrade-timer">15</div>
        </div>
        <div id="upgrade-cards"></div>
        <div id="upgrade-status">點擊卡片，或按鍵盤 1 / 2 / 3</div>
      </div>
    </div>

    <!-- 大廳（未加入任何房間時顯示） -->
    <div id="lobby">
      <div class="lobby-card">
        <h1>Co-op Shooter</h1>
        <p class="subtitle">2～4 人合作打怪・波次生存・Boss 戰・Roguelike 強化</p>

        <div id="lobby-invite" class="invite-banner" hidden></div>

        <label class="field">
          <span>玩家暱稱（1～12 字元）</span>
          <div class="row">
            <input id="nickname" type="text" maxlength="12" autocomplete="off" placeholder="輸入你的暱稱" />
            <button id="dice-btn" type="button" title="隨機暱稱">隨機</button>
          </div>
        </label>

        <button id="create-btn" class="primary" type="button">建立新房間</button>

        <div class="divider"><span>或加入現有房間</span></div>

        <label class="field">
          <span>房號</span>
          <div class="row">
            <input id="room-input" type="text" maxlength="4" autocomplete="off" placeholder="輸入 4 碼房號" />
            <button id="join-btn" type="button">加入房間</button>
          </div>
        </label>

        <p id="lobby-error" class="error" role="alert"></p>
        <p id="lobby-status" class="status"></p>

        <div class="legend">
          <span><i style="background:#3fb950"></i>醫療包 +30 HP</span>
          <span><i style="background:#58a6ff"></i>散彈強化 8 秒</span>
